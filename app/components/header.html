<script>
  // Runs before first paint. Same rules as loadSession in app/lib/account.ts; the tests run both on the same records.
  ;(function () {
    try {
      var account = JSON.parse(localStorage.getItem('marque.account') || 'null')
      var firstName = account && typeof account.firstName === 'string' ? account.firstName.trim() : ''
      var contact = account && account.contact
      var value = contact && typeof contact.value === 'string' ? contact.value.trim() : ''
      var known = !!contact && (contact.kind === 'email' || contact.kind === 'mobile')
      var reachable = /^[^\s@]+@(?:[^\s@.]+\.)+[^\s@.]{2,}$/.test(value) || /^(?:\+?63|0)?(9\d{9})$/.test(value.replace(/[\s().-]/g, ''))
      if (firstName && firstName.length <= 40 && known && reachable) {
        document.documentElement.setAttribute('data-signed-in', '')
        var first = firstName.split(/\s+/)[0]
        document.querySelectorAll('[data-account-name]').forEach(function (label) { label.textContent = first })
      }
    } catch {}
  })()
</script>
