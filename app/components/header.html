<script>
  // Runs before first paint, so it can't wait for the backend. Same rules as readSession in app/lib/backend/local-auth.ts; the tests run both.
  ;(function () {
    try {
      var account = JSON.parse(localStorage.getItem('marque.account') || 'null')
      if (!account || typeof account !== 'object') return
      var name = account.firstName
      var named = typeof name === 'string' && name.trim() !== '' && name.trim().length <= 40
      var email = typeof account.email === 'string' ? account.email.trim() : ''
      if ((named || name === undefined || name === null) && /^[^\s@]+@(?:[^\s@.]+\.)+[^\s@.]{2,}$/.test(email)) {
        document.documentElement.setAttribute('data-signed-in', '')
        var label = named ? name.trim().split(/\s+/)[0] : email.slice(0, email.lastIndexOf('@'))
        document.querySelectorAll('[data-account-name]').forEach(function (el) {
          el.textContent = label
          el.closest('a').title = email
        })
        document.querySelectorAll('[data-account-email]').forEach(function (el) { el.textContent = email })
      }
    } catch {}
  })()
</script>
